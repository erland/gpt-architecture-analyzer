name: Build distributions

on:
  push:
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install migration validation dependencies
        run: python3 -m pip install pyyaml pytest

      - name: Lint GPT project
        run: python3 scripts/lint_gpt_project.py

      - name: Run deterministic tests
        run: python3 -m pytest -q -p no:cacheprovider

      - name: Validate instruction-adherence suite
        run: python3 scripts/validate_instruction_adherence.py

      - name: Resolve version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "release" ]]; then
            TAG='${{ github.event.release.tag_name }}'
            if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]; then
              echo "Release-taggen måste följa v<semver>, t.ex. v1.2.3" >&2
              exit 1
            fi
            VERSION="${TAG#v}"
          else
            VERSION="$(tr -d '[:space:]' < VERSION)"
            if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]; then
              echo "VERSION måste vara SemVer, t.ex. 1.2.3" >&2
              exit 1
            fi
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build distributions
        run: python3 scripts/build_distributions.py --version "${{ steps.version.outputs.version }}"

      - name: Validate distributions
        run: python3 scripts/validate_distributions.py --version "${{ steps.version.outputs.version }}"

      - name: Validate runtime parity
        run: python3 scripts/validate_runtime_parity.py --version "${{ steps.version.outputs.version }}"

      - name: Validate release readiness
        run: python3 scripts/validate_release_readiness.py --version "${{ steps.version.outputs.version }}"

      - name: Final project hygiene
        run: python3 scripts/project_hygiene.py --project-root . --mode final

      - name: Validate workflow parity
        run: python3 scripts/validate_workflow_parity.py

      - name: Verify reproducible delivery
        run: python3 scripts/verify_reproducible_build.py --version "${{ steps.version.outputs.version }}"

      - name: Upload Actions artifacts
        uses: actions/upload-artifact@v4
        with:
          name: architecture-analyzer-v${{ steps.version.outputs.version }}
          path: |
            dist/*.zip
            dist/SHA256SUMS.txt
            dist/DELIVERY-MANIFEST.json
          retention-days: 14

      - name: Attach ZIP files to GitHub Release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          gh release upload "${{ github.event.release.tag_name }}" \
            "dist/architecture-analyzer-project-v${VERSION}.zip" \
            "dist/architecture-analyzer-chat-v${VERSION}.zip" \
            "dist/architecture-analyzer-custom-gpt-v${VERSION}.zip" \
            "dist/architecture-analyzer-claude-v${VERSION}.zip" \
            "dist/architecture-analyzer-opencode-v${VERSION}.zip" \
            dist/SHA256SUMS.txt \
            dist/DELIVERY-MANIFEST.json \
            --clobber
